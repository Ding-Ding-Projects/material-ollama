name: Windows release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CGO_CFLAGS: '-O3'
  CGO_CXXFLAGS: '-O3'

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      # Signing is intentionally impossible in this workflow.
      KEY_CONTAINER: ''
      OLLAMA_CERT: ''
      SIGN_TOOL: ''
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            LLAMA_CPP_VERSION
            MLX_VERSION
            MLX_C_VERSION

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: |
            app/ui/app/package-lock.json
            site/package-lock.json

      - name: Bootstrap pinned Windows build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw scripts/release-dependencies.json | ConvertFrom-Json
          $inno = $manifest.dependencies | Where-Object name -eq 'Inno Setup'
          $ninja = $manifest.dependencies | Where-Object name -eq 'Ninja'
          $sevenZip = $manifest.dependencies | Where-Object name -eq '7-Zip'
          choco install -y --no-progress InnoSetup --version $inno.version
          choco install -y --no-progress ninja --version $ninja.version
          $sevenZipId = '7zip.install'
          $sevenZipPinnedVersion = [Version]::Parse([string]$sevenZip.version)
          function Get-ChocolateyPackageState {
            param([Parameter(Mandatory)][string]$PackageId)

            $pattern = "^\s*$([regex]::Escape($PackageId))\|(?<version>[0-9]+(?:\.[0-9]+){1,3})(?:\|.*)?\s*$"
            $output = @(& choco list --local-only --exact --limit-output $PackageId 2>&1)
            $exitCode = $LASTEXITCODE
            $record = $output |
              Where-Object { $_ -is [string] -and $_ -match $pattern } |
              Select-Object -First 1
            $version = $null
            if ($record) {
              $match = [regex]::Match($record, $pattern)
              $version = [Version]::Parse($match.Groups['version'].Value)
            }

            [pscustomobject]@{
              ExitCode = $exitCode
              Version = $version
              Output = ($output -join [Environment]::NewLine)
            }
          }

          $sevenZipInitial = Get-ChocolateyPackageState -PackageId $sevenZipId
          $sevenZipState = $sevenZipInitial
          if ($sevenZipInitial.ExitCode -eq 0 -and
              $sevenZipInitial.Version -and
              $sevenZipInitial.Version -ge $sevenZipPinnedVersion) {
            Write-Host "Reusing verified $sevenZipId v$($sevenZipInitial.Version); manifest minimum is v$($sevenZip.version)."
          } else {
            Write-Host "Installing $sevenZipId v$($sevenZip.version); observed version is '$($sevenZipInitial.Version)'."
            $sevenZipInstallOutput = @(& choco install -y --no-progress $sevenZipId --version $sevenZip.version 2>&1)
            $sevenZipInstallExit = $LASTEXITCODE
            $sevenZipState = Get-ChocolateyPackageState -PackageId $sevenZipId
            $sevenZipReady = $sevenZipState.ExitCode -eq 0 -and
              $sevenZipState.Version -and
              $sevenZipState.Version -ge $sevenZipPinnedVersion
            if (-not $sevenZipReady) {
              throw @"
          7-Zip bootstrap failed: package '$sevenZipId' requires minimum version '$($sevenZip.version)'.
          Initial probe: exit=$($sevenZipInitial.ExitCode), version='$($sevenZipInitial.Version)', output='$($sevenZipInitial.Output)'.
          Install attempt: exit=$sevenZipInstallExit, output='$($sevenZipInstallOutput -join [Environment]::NewLine)'.
          Post-install probe: exit=$($sevenZipState.ExitCode), version='$($sevenZipState.Version)', output='$($sevenZipState.Output)'.
          "@
              }
            Write-Host "7-Zip package ready at v$($sevenZipState.Version)."
          }
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1" -ErrorAction SilentlyContinue
          refreshenv
          $sevenZipCommand = Get-Command 7z -ErrorAction SilentlyContinue
          if (-not $sevenZipCommand) {
            throw "7-Zip bootstrap verification failed: package '$sevenZipId' is v$($sevenZipState.Version), but 7z.exe is not available on PATH after refreshenv."
          }
          $sevenZipInfo = @(& $sevenZipCommand.Source i 2>&1)
          $sevenZipInfoExit = $LASTEXITCODE
          if ($sevenZipInfoExit -ne 0) {
            throw "7-Zip bootstrap verification failed: '$($sevenZipCommand.Source) i' exited $sevenZipInfoExit. Output: $($sevenZipInfo -join [Environment]::NewLine)"
          }
          Write-Host "Verified usable 7-Zip executable at $($sevenZipCommand.Source) for package v$($sevenZipState.Version)."

          & .\scripts\bootstrap_windows_tools.ps1 -ManifestPath .\scripts\release-dependencies.json
          if ($LASTEXITCODE -ne 0) { throw "Windows tool bootstrap failed with exit code $LASTEXITCODE" }

      - name: Resolve release metadata
        shell: pwsh
        run: node scripts/release-metadata.mjs --output release-metadata.json --target-repo "$env:GITHUB_REPOSITORY"

      - name: Build Windows binaries and installer
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path version/version.go -Pattern 'Version\s+string\s*=\s*"([^"]+)"' | Select-Object -First 1
          $baseVersion = if ($match) { $match.Matches[0].Groups[1].Value } else { '0.0.0' }
          $env:VERSION = "$baseVersion-build.${{ github.run_number }}"
          Write-Host "Building $env:VERSION"
          & .\scripts\build_windows.ps1 cpu cpuArm64 ollama ollamaArm64 app appArm64 deps sign installer zip
          if ($LASTEXITCODE -ne 0) { throw "build_windows.ps1 failed with exit code $LASTEXITCODE" }

      - name: Verify unsigned Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'dist\OllamaSetup.exe',
            'dist\install.ps1',
            'dist\ollama-windows-amd64.zip',
            'dist\windows-amd64\ollama.exe',
            'dist\windows-amd64\lib\ollama\llama-server.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required release output: $path" }
          }
          $signature = Get-AuthenticodeSignature -LiteralPath 'dist\OllamaSetup.exe'
          if ($signature.Status -ne 'NotSigned') {
            throw "OllamaSetup.exe is not unsigned: Authenticode status $($signature.Status)"
          }
          Write-Host 'OllamaSetup.exe is unsigned as required by project policy.'

      - name: Generate line-count evidence
        shell: pwsh
        run: |
          node scripts/count-lines.mjs --format markdown | Out-File -FilePath dist\line-count.md -Encoding utf8
          node scripts/count-lines.mjs --format json | Out-File -FilePath dist\line-count.json -Encoding utf8

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $root = (Resolve-Path 'dist').Path
          Get-ChildItem -LiteralPath $root -File -Recurse |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path.Substring($root.Length + 1))" } |
            Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding utf8

      - name: Upload release evidence even when a prior step fails
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-evidence-${{ github.run_id }}
          path: |
            dist/**
            release-metadata.json
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    if: ${{ needs.windows-build.result == 'success' }}
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows release evidence
        uses: actions/download-artifact@v4
        with:
          name: windows-release-evidence-${{ github.run_id }}
          path: release-input

      - name: Create one unique non-draft release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path version/version.go -Pattern 'Version\s+string\s*=\s*"([^"]+)"' | Select-Object -First 1
          $baseVersion = if ($match) { $match.Matches[0].Groups[1].Value } else { '0.0.0' }
          $tag = "v$baseVersion-build.${{ github.run_number }}"
          $title = "Material Ollama $tag"
          $metadata = Get-Content -Raw 'release-input\release-metadata.json' | ConvertFrom-Json
          $lineCount = Get-Content -Raw 'release-input\dist\line-count.md'
          $workflowRun = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}" | ConvertFrom-Json
          if (-not $workflowRun.run_started_at) { throw 'Workflow run did not expose run_started_at' }
          $workflowStartedAt = [DateTimeOffset]::Parse($workflowRun.run_started_at).ToUniversalTime()
          $workflowStartedText = $workflowStartedAt.ToString("yyyy-MM-ddTHH:mm:ss.fff'Z'")

          $distRoot = (Resolve-Path 'release-input\dist').Path
          $stagingRoot = Join-Path $env:RUNNER_TEMP 'material-ollama-release-assets'
          if (Test-Path -LiteralPath $stagingRoot) { Remove-Item -LiteralPath $stagingRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null
          $inputFiles = @(
            Get-ChildItem -LiteralPath $distRoot -File -Recurse
            Get-Item -LiteralPath 'release-input\release-metadata.json'
          ) | Sort-Object FullName
          $usedNames = @{}
          $stagedAssets = @()
          foreach ($file in $inputFiles) {
            if ($file.FullName.StartsWith($distRoot + '\', [StringComparison]::OrdinalIgnoreCase)) {
              $relative = $file.FullName.Substring($distRoot.Length + 1)
            } else {
              $relative = 'release-metadata.json'
            }
            $normalized = $relative.Replace('\', '/')
            if ($normalized.Contains('/')) {
              $pathBytes = [Text.Encoding]::UTF8.GetBytes($normalized)
              $pathHasher = [Security.Cryptography.SHA256]::Create()
              try {
                $pathHash = -join ($pathHasher.ComputeHash($pathBytes) | ForEach-Object { $_.ToString('x2') })
              } finally {
                $pathHasher.Dispose()
              }
              $uploadName = (($normalized -replace '[^A-Za-z0-9._-]', '__') + '--' + $pathHash.Substring(0, 12))
            } else {
              $uploadName = $file.Name
            }
            if ($usedNames.ContainsKey($uploadName)) { throw "Deterministic upload-name collision: $uploadName" }
            $usedNames[$uploadName] = $true
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $stagingRoot $uploadName) -Force
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $stagedAssets += [pscustomobject]@{
              source = $normalized
              uploadName = $uploadName
              sha256 = $hash
              bytes = $file.Length
            }
          }
          $requiredStableNames = @(
            'OllamaSetup.exe',
            'install.ps1',
            'ollama-windows-amd64.zip',
            'SHA256SUMS.txt',
            'release-metadata.json'
          )
          foreach ($requiredName in $requiredStableNames) {
            if (-not ($stagedAssets.uploadName -contains $requiredName)) {
              throw "Required stable release asset is missing: $requiredName"
            }
          }
          $manifestPath = Join-Path $stagingRoot 'asset-upload-manifest.json'
          [ordered]@{
            schemaVersion = 1
            assets = $stagedAssets
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          $manifestHash = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $stagedAssets += [pscustomobject]@{
            source = 'asset-upload-manifest.json'
            uploadName = 'asset-upload-manifest.json'
            sha256 = $manifestHash
            bytes = (Get-Item -LiteralPath $manifestPath).Length
          }
          if ($metadata.status -eq 'selected') {
            $metadataNotes = @(
              "- Code name: $($metadata.codeName)"
              "- Dish ID: $($metadata.dishId)"
              "- English name: $($metadata.name.en)"
              "- Traditional Chinese name: $($metadata.name.zhHant)"
              "- Source catalog release: [$($metadata.sourceReleaseTag)]($($metadata.sourceReleaseUrl))"
              "- Authoritative public image: [$($metadata.imageAssetName)]($($metadata.imageUrl))"
              '- Copy boundary: this project does not download, vendor, or attach a duplicate dim-sum image; the linked public release asset remains the image authority.'
            )
          } else {
            $metadataNotes = @(
              "- Status: $($metadata.status)"
              "- Reason: $($metadata.reason)"
              '- Copy boundary: this project does not download, vendor, or attach dim-sum images.'
            )
          }
          $metadataNotesText = $metadataNotes -join "`n"
          function Get-ReleaseNotes {
            param(
              [string]$WorkflowCompleted,
              [string]$WorkflowDuration
            )
            $assetLines = $stagedAssets | Sort-Object uploadName | ForEach-Object { "- $($_.uploadName)" }
            @"
          # $title

          Windows release for commit `${{ github.sha }}`.

          ## Installer and package status

          The Windows installer and archives are unsigned. Windows may show an unknown-publisher or SmartScreen warning; no signing certificate or signing service was used.

          ## Release evidence

          - Workflow started: $workflowStartedText
          - Workflow completed: $WorkflowCompleted
          - Workflow duration: $WorkflowDuration
          - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Platform: Windows x64, with ARM64 output when the cross-compiler produced it.
          - Source commit: `${{ github.sha }}`

          ## Dim sum release metadata

          $metadataNotesText

          The complete machine-readable record is attached as `release-metadata.json`. The public catalog remains the image authority; no image is copied into this project.

          ### Line-count table

          $lineCount

          ### Assets

          $($assetLines -join "`n")
          "@
          }
          $notes = Get-ReleaseNotes -WorkflowCompleted 'pending until asset upload completes' -WorkflowDuration 'pending until asset upload completes'
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release tag already exists: $tag" }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target '${{ github.sha }}' --title $title --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          foreach ($asset in $stagedAssets) {
            $assetPath = Join-Path $stagingRoot $asset.uploadName
            gh release upload $tag $assetPath --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed for staged asset $($asset.uploadName)" }
          }
          $workflowCompletedAt = [DateTimeOffset]::UtcNow
          if ($workflowCompletedAt -lt $workflowStartedAt) { throw 'Workflow completion timestamp precedes workflow start timestamp' }
          $workflowCompletedText = $workflowCompletedAt.ToString("yyyy-MM-ddTHH:mm:ss.fff'Z'")
          $elapsed = $workflowCompletedAt - $workflowStartedAt
          $workflowDuration = "{0:00}:{1:00}:{2:00}" -f [int]$elapsed.TotalHours, $elapsed.Minutes, $elapsed.Seconds
          $notes = Get-ReleaseNotes -WorkflowCompleted $workflowCompletedText -WorkflowDuration $workflowDuration
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) {
            throw "gh release edit failed while recording workflow timing"
          }

      - name: Verify the published release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path version/version.go -Pattern 'Version\s+string\s*=\s*"([^"]+)"' | Select-Object -First 1
          $baseVersion = if ($match) { $match.Matches[0].Groups[1].Value } else { '0.0.0' }
          $tag = "v$baseVersion-build.${{ github.run_number }}"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($release.draft) { throw 'Published release is still a draft' }
          if ($release.tag_name -ne $tag) { throw "Unexpected release tag: $($release.tag_name)" }
          $commit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq .sha
          if ($commit.Trim() -ne '${{ github.sha }}') { throw "Release target mismatch: $commit" }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $duplicateNames = @($assetNames | Group-Object | Where-Object Count -gt 1)
          if ($duplicateNames.Count -gt 0) {
            throw "Published release contains duplicate asset names: $($duplicateNames.Name -join ', ')"
          }
          $requiredNames = @(
            'OllamaSetup.exe',
            'install.ps1',
            'ollama-windows-amd64.zip',
            'SHA256SUMS.txt',
            'release-metadata.json',
            'asset-upload-manifest.json'
          )
          foreach ($requiredName in $requiredNames) {
            if (-not ($assetNames -contains $requiredName)) { throw "Published release is missing required asset: $requiredName" }
          }
          $stagingRoot = Join-Path $env:RUNNER_TEMP 'material-ollama-release-assets'
          $manifest = Get-Content -Raw (Join-Path $stagingRoot 'asset-upload-manifest.json') | ConvertFrom-Json
          $expectedNames = @($manifest.assets | ForEach-Object uploadName) + 'asset-upload-manifest.json'
          $missingStaged = @($expectedNames | Where-Object { $assetNames -notcontains $_ })
          if ($missingStaged.Count -gt 0) { throw "Published release is missing staged assets: $($missingStaged -join ', ')" }
          if ($assetNames.Count -ne $expectedNames.Count) {
            throw "Published release asset count mismatch: expected $($expectedNames.Count), got $($assetNames.Count)"
          }
          $body = [string]$release.body
          foreach ($timingLabel in @('Workflow started:', 'Workflow completed:', 'Workflow duration:')) {
            if ($body -notmatch [regex]::Escape($timingLabel)) { throw "Release notes omit $timingLabel" }
          }
          if ($body -match 'Workflow completed: pending|Workflow duration: pending') {
            throw 'Release notes still contain pending workflow timing'
          }
          $metadata = Get-Content -Raw 'release-input\release-metadata.json' | ConvertFrom-Json
          if ($metadata.status -eq 'selected') {
            foreach ($metadataLabel in @('Code name:', 'Dish ID:', 'English name:', 'Traditional Chinese name:', 'Source catalog release:', 'Authoritative public image:', 'Copy boundary:')) {
              if ($body -notmatch [regex]::Escape($metadataLabel)) { throw "Release notes omit $metadataLabel" }
            }
          }
          "Release verified: $($release.html_url)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
