name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CGO_CFLAGS: '-O3'
  CGO_CXXFLAGS: '-O3'

jobs:
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      # Signing is intentionally impossible in this workflow.
      KEY_CONTAINER: ''
      OLLAMA_CERT: ''
      SIGN_TOOL: ''
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            LLAMA_CPP_VERSION
            MLX_VERSION
            MLX_C_VERSION

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: |
            app/ui/app/package-lock.json
            site/package-lock.json

      - name: Bootstrap pinned Windows build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw scripts/release-dependencies.json | ConvertFrom-Json
          $inno = $manifest.dependencies | Where-Object name -eq 'Inno Setup'
          $ninja = $manifest.dependencies | Where-Object name -eq 'Ninja'
          $sevenZip = $manifest.dependencies | Where-Object name -eq '7-Zip'
          choco install -y --no-progress InnoSetup --version $inno.version
          choco install -y --no-progress ninja --version $ninja.version
          $sevenZipId = '7zip.install'
          $sevenZipPinnedVersion = [Version]::Parse([string]$sevenZip.version)
          function Get-ChocolateyPackageState {
            param([Parameter(Mandatory)][string]$PackageId)

            $pattern = "^\s*$([regex]::Escape($PackageId))\|(?<version>[0-9]+(?:\.[0-9]+){1,3})(?:\|.*)?\s*$"
            $output = @(& choco list --local-only --exact --limit-output $PackageId 2>&1)
            $exitCode = $LASTEXITCODE
            $record = $output |
              Where-Object { $_ -is [string] -and $_ -match $pattern } |
              Select-Object -First 1
            $version = $null
            if ($record) {
              $match = [regex]::Match($record, $pattern)
              $version = [Version]::Parse($match.Groups['version'].Value)
            }

            [pscustomobject]@{
              ExitCode = $exitCode
              Version = $version
              Output = ($output -join [Environment]::NewLine)
            }
          }

          $sevenZipInitial = Get-ChocolateyPackageState -PackageId $sevenZipId
          $sevenZipState = $sevenZipInitial
          if ($sevenZipInitial.ExitCode -eq 0 -and
              $sevenZipInitial.Version -and
              $sevenZipInitial.Version -ge $sevenZipPinnedVersion) {
            Write-Host "Reusing verified $sevenZipId v$($sevenZipInitial.Version); manifest minimum is v$($sevenZip.version)."
          } else {
            Write-Host "Installing $sevenZipId v$($sevenZip.version); observed version is '$($sevenZipInitial.Version)'."
            $sevenZipInstallOutput = @(& choco install -y --no-progress $sevenZipId --version $sevenZip.version 2>&1)
            $sevenZipInstallExit = $LASTEXITCODE
            $sevenZipState = Get-ChocolateyPackageState -PackageId $sevenZipId
            $sevenZipReady = $sevenZipState.ExitCode -eq 0 -and
              $sevenZipState.Version -and
              $sevenZipState.Version -ge $sevenZipPinnedVersion
            if (-not $sevenZipReady) {
              throw @"
          7-Zip bootstrap failed: package '$sevenZipId' requires minimum version '$($sevenZip.version)'.
          Initial probe: exit=$($sevenZipInitial.ExitCode), version='$($sevenZipInitial.Version)', output='$($sevenZipInitial.Output)'.
          Install attempt: exit=$sevenZipInstallExit, output='$($sevenZipInstallOutput -join [Environment]::NewLine)'.
          Post-install probe: exit=$($sevenZipState.ExitCode), version='$($sevenZipState.Version)', output='$($sevenZipState.Output)'.
          "@
              }
            Write-Host "7-Zip package ready at v$($sevenZipState.Version)."
          }
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1" -ErrorAction SilentlyContinue
          refreshenv
          $sevenZipCommand = Get-Command 7z -ErrorAction SilentlyContinue
          if (-not $sevenZipCommand) {
            throw "7-Zip bootstrap verification failed: package '$sevenZipId' is v$($sevenZipState.Version), but 7z.exe is not available on PATH after refreshenv."
          }
          $sevenZipInfo = @(& $sevenZipCommand.Source i 2>&1)
          $sevenZipInfoExit = $LASTEXITCODE
          if ($sevenZipInfoExit -ne 0) {
            throw "7-Zip bootstrap verification failed: '$($sevenZipCommand.Source) i' exited $sevenZipInfoExit. Output: $($sevenZipInfo -join [Environment]::NewLine)"
          }
          Write-Host "Verified usable 7-Zip executable at $($sevenZipCommand.Source) for package v$($sevenZipState.Version)."

          & .\scripts\bootstrap_windows_tools.ps1 -ManifestPath .\scripts\release-dependencies.json
          if ($LASTEXITCODE -ne 0) { throw "Windows tool bootstrap failed with exit code $LASTEXITCODE" }

      - name: Resolve release metadata
        shell: pwsh
        run: node scripts/release-metadata.mjs --output release-metadata.json --target-repo "$env:GITHUB_REPOSITORY"

      - name: Write embedded build metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # app/ui/buildinfo embeds this file (go:embed buildinfo.json) so the
          # Status screen can report a real version, commit, dim-sum release
          # code name, workflow run, and offline catalog snapshot -- entirely
          # offline. This step must run AFTER "Resolve release metadata"
          # (release-metadata.json must already exist) and BEFORE the Windows
          # binaries are built, so the embed captures real data rather than
          # the checked-in buildinfo.default.json placeholder.
          $match = Select-String -Path version/version.go -Pattern 'Version\s+string\s*=\s*"([^"]+)"' | Select-Object -First 1
          $baseVersion = if ($match) { $match.Matches[0].Groups[1].Value } else { '0.0.0' }
          $version = "$baseVersion-build.${{ github.run_number }}"
          $commit = "$env:GITHUB_SHA"
          $shortCommit = if ($commit.Length -ge 12) { $commit.Substring(0, 12) } else { $commit }
          $builtAt = [DateTimeOffset]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ss.fff'Z'")

          $metadata = Get-Content -Raw 'release-metadata.json' | ConvertFrom-Json
          $codeName = $null
          $dishId = $null
          $dishNameEn = $null
          $dishNameZhHant = $null
          if ($metadata.status -eq 'selected') {
            $codeName = $metadata.codeName
            $dishId = $metadata.dishId
            $dishNameEn = $metadata.name.en
            $dishNameZhHant = $metadata.name.zhHant
          }

          # A build-time snapshot of the public dim-sum catalog's dish list,
          # so the Status screen's release catalog is real and works offline.
          # This project links to the public catalog's own image asset and
          # never vendors or mirrors dim-sum photos -- see AGENTS.md's
          # "Public dim-sum photo source" section -- so only id/slug/name are
          # snapshotted here, never an image.
          $catalogDishes = @()
          try {
            $catalog = Invoke-RestMethod -Uri 'https://raw.githubusercontent.com/Ding-Ding-Projects/dim-sum-photos/main/catalog/index.json' -Headers @{ 'user-agent' = 'material-ollama-buildinfo' }
            foreach ($dish in $catalog.dishes) {
              if ($dish.id -and $dish.name.en -and $dish.name.zhHant) {
                $catalogDishes += [ordered]@{
                  id = $dish.id
                  slug = $dish.slug
                  nameEn = $dish.name.en
                  nameZhHant = $dish.name.zhHant
                }
              }
            }
          } catch {
            # The offline catalog snapshot is best-effort: a transient
            # network failure here must not fail the whole release build.
            # A binary built with an empty catalog is still honest -- it
            # just has nothing to show in that one list.
            Write-Warning "buildinfo: dim-sum catalog snapshot unavailable: $($_.Exception.Message)"
          }

          $buildInfo = [ordered]@{
            schemaVersion = 1
            version = $version
            commit = $commit
            shortCommit = $shortCommit
            codeName = $codeName
            dishId = $dishId
            dishNameEn = $dishNameEn
            dishNameZhHant = $dishNameZhHant
            workflowRunNumber = ${{ github.run_number }}
            workflowRunId = ${{ github.run_id }}
            builtAt = $builtAt
            catalog = @($catalogDishes)
          }
          $buildInfoJson = $buildInfo | ConvertTo-Json -Depth 6
          Set-Content -LiteralPath 'app/ui/buildinfo/buildinfo.json' -Value $buildInfoJson -Encoding utf8 -NoNewline
          Write-Host "Wrote app/ui/buildinfo/buildinfo.json for $version ($shortCommit)"
          Write-Host $buildInfoJson

      - name: Build Windows binaries and installer
        shell: pwsh
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path version/version.go -Pattern 'Version\s+string\s*=\s*"([^"]+)"' | Select-Object -First 1
          $baseVersion = if ($match) { $match.Matches[0].Groups[1].Value } else { '0.0.0' }
          $env:VERSION = "$baseVersion-build.${{ github.run_number }}"
          Write-Host "Building $env:VERSION"
          & .\scripts\build_windows.ps1 cpu cpuArm64 ollama ollamaArm64 app appArm64 deps sign installer zip
          if ($LASTEXITCODE -ne 0) { throw "build_windows.ps1 failed with exit code $LASTEXITCODE" }

      - name: Verify unsigned Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'dist\OllamaSetup.exe',
            'dist\install.ps1',
            'dist\ollama-windows-amd64.zip',
            'dist\windows-amd64\ollama.exe',
            'dist\windows-amd64\lib\ollama\llama-server.exe',
            'dist\windows-arm64\ollama.exe',
            'dist\windows-arm64\lib\ollama\llama-server.exe',
            'dist\windows-ollama-app-amd64.exe',
            'dist\windows-ollama-app-arm64.exe',
            'dist\webview2\MicrosoftEdgeWebView2RuntimeInstallerX64.exe',
            'dist\webview2\MicrosoftEdgeWebView2RuntimeInstallerARM64.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing required release output: $path" }
          }
          $signature = Get-AuthenticodeSignature -LiteralPath 'dist\OllamaSetup.exe'
          if ($signature.Status -ne 'NotSigned') {
            throw "OllamaSetup.exe is not unsigned: Authenticode status $($signature.Status)"
          }
          Write-Host 'OllamaSetup.exe is unsigned as required by project policy.'

      - name: Generate line-count evidence
        shell: pwsh
        run: |
          node scripts/count-lines.mjs --format markdown | Out-File -FilePath dist\line-count.md -Encoding utf8
          node scripts/count-lines.mjs --format json | Out-File -FilePath dist\line-count.json -Encoding utf8

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $root = (Resolve-Path 'dist').Path
          Get-ChildItem -LiteralPath $root -File -Recurse |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path.Substring($root.Length + 1))" } |
            Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding utf8

      - name: Verify nested payload archive coverage
        shell: pwsh
        run: node scripts/check-release-assets.mjs --dist dist

      - name: Upload release evidence even when a prior step fails
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-evidence-${{ github.run_id }}
          path: |
            dist/**
            release-metadata.json
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    if: ${{ needs.windows-build.result == 'success' }}
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows release evidence
        uses: actions/download-artifact@v4
        with:
          name: windows-release-evidence-${{ github.run_id }}
          path: release-input

      - name: Create one unique recoverable draft release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path version/version.go -Pattern 'Version\s+string\s*=\s*"([^"]+)"' | Select-Object -First 1
          $baseVersion = if ($match) { $match.Matches[0].Groups[1].Value } else { '0.0.0' }
          $tag = "v$baseVersion-build.${{ github.run_number }}"
          $title = "Material Ollama $tag"
          $metadata = Get-Content -Raw 'release-input\release-metadata.json' | ConvertFrom-Json
          $lineCount = Get-Content -Raw 'release-input\dist\line-count.md'
          $workflowRun = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}" | ConvertFrom-Json
          if (-not $workflowRun.run_started_at) { throw 'Workflow run did not expose run_started_at' }
          $workflowStartedAt = [DateTimeOffset]::Parse($workflowRun.run_started_at).ToUniversalTime()
          $workflowStartedText = $workflowStartedAt.ToString("yyyy-MM-ddTHH:mm:ss.fff'Z'")

          $distRoot = (Resolve-Path 'release-input\dist').Path
          node scripts/check-release-assets.mjs --dist $distRoot
          $stagingRoot = Join-Path $env:RUNNER_TEMP 'material-ollama-release-assets'
          if (Test-Path -LiteralPath $stagingRoot) { Remove-Item -LiteralPath $stagingRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null
          # One release, one download: the installer is the whole universal bundle.
          # The portable archives, dependency audits, checksums and line-count table
          # stay downloadable from this run's windows-release-evidence artifact.
          Copy-Item -LiteralPath (Join-Path $distRoot 'OllamaSetup.exe') -Destination (Join-Path $stagingRoot 'OllamaSetup.exe') -Force
          $assetNames = @('OllamaSetup.exe')
          node scripts/check-release-assets.mjs --tag $tag --asset-names @assetNames
          $stagedAssets = @($assetNames | ForEach-Object {
            $assetPath = Join-Path $stagingRoot $_
            [pscustomobject]@{
              uploadName = $_
              sha256 = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
              bytes = (Get-Item -LiteralPath $assetPath).Length
            }
          })
          if ($metadata.status -eq 'selected') {
            $metadataNotes = @(
              "- Code name: $($metadata.codeName)"
              "- Dish ID: $($metadata.dishId)"
              "- English name: $($metadata.name.en)"
              "- Traditional Chinese name: $($metadata.name.zhHant)"
              "- Source catalog release: [$($metadata.sourceReleaseTag)]($($metadata.sourceReleaseUrl))"
              "- Authoritative public image: [$($metadata.imageAssetName)]($($metadata.imageUrl))"
              '- Copy boundary: this project does not download, vendor, or attach a duplicate dim-sum image; the linked public release asset remains the image authority.'
            )
          } else {
            $metadataNotes = @(
              "- Status: $($metadata.status)"
              "- Reason: $($metadata.reason)"
              '- Copy boundary: this project does not download, vendor, or attach dim-sum images.'
            )
          }
          $metadataNotesText = $metadataNotes -join "`n"
          function Get-ReleaseNotes {
            param(
              [string]$WorkflowCompleted,
              [string]$WorkflowDuration
            )
            $assetLines = $stagedAssets | Sort-Object uploadName | ForEach-Object { "- $($_.uploadName) — $($_.bytes) bytes — SHA-256 ``$($_.sha256)``" }
            @"
          # $title

          Windows release for commit ${{ github.sha }}.

          ## One download

          `OllamaSetup.exe` is the whole product. It carries the desktop app, the `ollama` server and CLI for both x64 and ARM64, the llama.cpp runners and every ggml CPU variant, and the Microsoft Edge WebView2 runtime, which it installs only if the machine does not already have it. There is nothing else to download.

          Portable archives, per-architecture dependency audits, `SHA256SUMS.txt`, the line-count table and `install.ps1` remain available from this run's `windows-release-evidence` artifact.

          ## Installer status

          The Windows installer is unsigned. Windows may show an unknown-publisher or SmartScreen warning; no signing certificate or signing service was used. That warning does not mean the file was tampered with -- verify it against the SHA-256 listed below.

          ## Release evidence

          - Workflow started: $workflowStartedText
          - Workflow completed: $WorkflowCompleted
          - Workflow duration: $WorkflowDuration
          - Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - Platform: Windows x64, with ARM64 output when the cross-compiler produced it.
          - Source commit: `${{ github.sha }}`

          ## Dim sum release metadata

          $metadataNotesText

          The complete machine-readable record ships as `release-metadata.json` in this run's `windows-release-evidence` artifact. The public catalog remains the image authority; no image is copied into this project.

          ### Line-count table

          $lineCount

          ### Assets

          $($assetLines -join "`n")
          "@
          }
          $notes = Get-ReleaseNotes -WorkflowCompleted 'pending until asset upload completes' -WorkflowDuration 'pending until asset upload completes'
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          $existingReleases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json | Where-Object tag_name -eq $tag)
          if ($existingReleases.Count -gt 0) { throw "Release tag already exists: $tag" }
          $draft = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases" -f tag_name=$tag -f target_commitish='${{ github.sha }}' -f name=$title -F "body=@release-notes.md" -F draft=true -F prerelease=false | ConvertFrom-Json
          if (-not $draft.id -or -not $draft.draft) { throw 'Draft release creation did not return a draft numeric release ID' }
          $releaseId = [string]$draft.id
          # Release asset uploads live on uploads.github.com, not api.github.com. A bare
          # gh api path resolves against the API host and returns 404. Take the real upload
          # host from the release response's own RFC 6570 upload_url template.
          if ($draft.upload_url -notmatch '^https://[^/]+/repos/') { throw 'Draft release did not expose a usable upload_url' }
          $uploadBase = $draft.upload_url -replace '\{.*$', ''
          foreach ($asset in $stagedAssets) {
            $assetPath = Join-Path $stagingRoot $asset.uploadName
            $contentType = if ($asset.uploadName.EndsWith('.zip')) { 'application/zip' } else { 'application/vnd.microsoft.portable-executable' }
            $assetName = [Uri]::EscapeDataString($asset.uploadName)
            $uploaded = gh api --method POST "${uploadBase}?name=$assetName" -H "Content-Type: $contentType" --input $assetPath | ConvertFrom-Json
            if (-not $uploaded.id -or $uploaded.name -ne $asset.uploadName) { throw "Numeric release upload failed for staged asset $($asset.uploadName)" }
          }
          $draft = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" | ConvertFrom-Json
          if (-not $draft.draft) { throw 'Release became non-draft before final pre-publication verification' }
          $draftNames = @($draft.assets | ForEach-Object name)
          node scripts/check-release-assets.mjs --tag $tag --asset-names @draftNames
          foreach ($asset in $stagedAssets) {
            $draftAsset = $draft.assets | Where-Object name -eq $asset.uploadName | Select-Object -First 1
            if (-not $draftAsset -or $draftAsset.size -ne $asset.bytes) { throw "Draft release asset readback mismatch: $($asset.uploadName)" }
          }
          $published = gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -F "body=@release-notes.md" -F draft=false | ConvertFrom-Json
          if ($published.draft -or -not $published.published_at) { throw 'Numeric release publication did not return a published release timestamp' }
          $workflowCompletedAt = [DateTimeOffset]::Parse($published.published_at).ToUniversalTime()
          if ($workflowCompletedAt -lt $workflowStartedAt) { throw 'Published release timestamp precedes workflow start timestamp' }
          $workflowCompletedText = $workflowCompletedAt.ToString("yyyy-MM-ddTHH:mm:ss.fff'Z'")
          $elapsed = $workflowCompletedAt - $workflowStartedAt
          $workflowDuration = "{0:00}:{1:00}:{2:00}" -f [int]$elapsed.TotalHours, $elapsed.Minutes, $elapsed.Seconds
          $notes = Get-ReleaseNotes -WorkflowCompleted $workflowCompletedText -WorkflowDuration $workflowDuration
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          $finalRelease = gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -F "body=@release-notes.md" | ConvertFrom-Json
          if ($finalRelease.draft) { throw 'Final numeric release update unexpectedly returned a draft release' }

      - name: Verify the published release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path version/version.go -Pattern 'Version\s+string\s*=\s*"([^"]+)"' | Select-Object -First 1
          $baseVersion = if ($match) { $match.Matches[0].Groups[1].Value } else { '0.0.0' }
          $tag = "v$baseVersion-build.${{ github.run_number }}"
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          if ($release.draft) { throw 'Published release is still a draft' }
          if ($release.tag_name -ne $tag) { throw "Unexpected release tag: $($release.tag_name)" }
          $commit = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq .sha
          if ($commit.Trim() -ne '${{ github.sha }}') { throw "Release target mismatch: $commit" }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $duplicateNames = @($assetNames | Group-Object | Where-Object Count -gt 1)
          if ($duplicateNames.Count -gt 0) {
            throw "Published release contains duplicate asset names: $($duplicateNames.Name -join ', ')"
          }
          node scripts/check-release-assets.mjs --tag $tag --asset-names @assetNames
          if ($assetNames.Count -ne 1) { throw "Published release asset count mismatch: expected 1, got $($assetNames.Count)" }
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'material-ollama-release-download'
          if (Test-Path -LiteralPath $downloadRoot) { Remove-Item -LiteralPath $downloadRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $downloadRoot | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'OllamaSetup.exe' --dir $downloadRoot
          foreach ($published in $release.assets) {
            $downloaded = Join-Path $downloadRoot $published.name
            if (-not (Test-Path -LiteralPath $downloaded -PathType Leaf)) { throw "Published asset did not download: $($published.name)" }
            if ((Get-Item -LiteralPath $downloaded).Length -ne $published.size) { throw "Published asset size mismatch: $($published.name)" }
            if ($published.digest -and $published.digest -match '^sha256:(?<hash>[0-9a-f]{64})$') {
              $actualHash = (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ne $matches.hash) { throw "Published asset hash mismatch: $($published.name)" }
            }
          }
          $body = [string]$release.body
          foreach ($timingLabel in @('Workflow started:', 'Workflow completed:', 'Workflow duration:')) {
            if ($body -notmatch [regex]::Escape($timingLabel)) { throw "Release notes omit $timingLabel" }
          }
          if ($body -match 'Workflow completed: pending|Workflow duration: pending') {
            throw 'Release notes still contain pending workflow timing'
          }
          foreach ($asset in $release.assets) {
            $hash = if ($asset.digest -match '^sha256:(?<hash>[0-9a-f]{64})$') { $matches.hash.ToLowerInvariant() } else { $null }
            if (-not $hash) { throw "Published asset has no structured SHA-256 digest: $($asset.name)" }
            if ($body -notmatch [regex]::Escape("SHA-256 ``$hash``")) { throw "Release notes omit SHA-256 for $($asset.name)" }
          }
          $metadata = Get-Content -Raw 'release-input\release-metadata.json' | ConvertFrom-Json
          if ($metadata.status -eq 'selected') {
            foreach ($metadataLabel in @('Code name:', 'Dish ID:', 'English name:', 'Traditional Chinese name:', 'Source catalog release:', 'Authoritative public image:', 'Copy boundary:')) {
              if ($body -notmatch [regex]::Escape($metadataLabel)) { throw "Release notes omit $metadataLabel" }
            }
          }
          "Release verified: $($release.html_url)" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY
